<header [@headerEnter] class="w-full border-b-2 border-brand-dark/30 bg-brand-accent-soft">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-2 py-7
   " >
    <a routerLink="/" class="flex items-center text-brand-ink">
      <img src="/assets/imagenrecolecta-circular.webp" alt="Recolecta" width="160" height="160"
           class="h-16 w-16 object-cover" loading="eager" fetchpriority="high" />
    </a>

    <nav class="hidden items-center gap-8 md:flex">
      @for (link of navLinks; track link.label) {
        <a
          [routerLink]="link.routerLink"
          [fragment]="link.fragment"
          routerLinkActive="text-brand-dark font-semibold"
          [routerLinkActiveOptions]="{ exact: link.exact === true }"
          class="text-sm font-medium text-brand-ink/80 transition hover:text-brand-dark">
          {{ link.label }}
        </a>
      }
    </nav>

    <button type="button"
            (click)="toggleMenu()"
            class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-brand-dark/30
                   text-brand-ink md:hidden"
            aria-label="Abrir menú">
      <app-icon name="menu" size="sm" />
    </button>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-brand-dark/15 md:hidden">
      <nav class="mx-auto flex max-w-6xl flex-col gap-2 px-6 py-4">
        @for (link of navLinks; track link.label) {
          <a [routerLink]="link.routerLink"
             [fragment]="link.fragment"
             routerLinkActive="bg-brand-dark/10 text-brand-dark font-semibold"
             [routerLinkActiveOptions]="{ exact: link.exact === true }"
             (click)="toggleMenu()"
             class="rounded-lg px-3 py-2 text-sm font-medium text-brand-ink/80 hover:bg-brand-dark/10">
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  }
</header>
